[workspace]
members = [
    "rxscan", "rxscan-core", "rxscan-port", "rxscan-sys", "rxscan-vuls", "rxscan-web",
]
default-members = ["rxscan"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive"] }
tokio = {version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = [
    "ansi",
    "env-filter",
    "local-time",
], default-features = false }
tracing-log = "0.2.0"
time = "0.3.44"
serde = "1.0.228"
serde_json = "1.0.145"
once_cell = "1.21.3"
regex = "1.12.2"
